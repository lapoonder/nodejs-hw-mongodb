type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  name:
    type: string
    example: Igor Potapenko
  phoneNumber:
    type: string
    example: '+380679878596'
  email:
    type: string
    example: igor@gmail.com
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
  photo:
    type: string
    format: binary
